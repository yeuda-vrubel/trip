<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חשבון טיול</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#14213D">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="חשבון טיול">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#14213D; --navy-2:#1E2D4F; --paper:#F7F3EA; --paper-2:#EDE6D8; --card:#FFFFFF; --line:#EEE7DA; --line-2:#E3DACA;
  --ink:#14213D; --muted:#5B6478; --coral:#FF6B4A; --coral-ink:#9A3412; --coral-soft:#FFE3DA;
  --teal:#0F766E; --teal-ink:#0B5F56; --teal-soft:#DDF1EC; --sun-soft:#FCF0D2; --sky-soft:#E4E8F2;
  --warn-bg:#FCF0D2; --warn:#7A4E00; --shadow:0 12px 30px rgba(20,33,61,.12); --r:20px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:Rubik,system-ui,sans-serif;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
button,input,select{font:inherit;color:inherit}
bdi{unicode-bidi:isolate}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:640px;margin:0 auto;padding:0 16px 130px}
/* hero */
.hero{background:var(--navy);color:var(--paper)}
.hero-in{max-width:640px;margin:0 auto;padding:22px 20px 64px;display:flex;flex-direction:column;gap:18px}
.hero.flat .hero-in{padding-bottom:26px}
.hero-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.back{width:44px;height:44px;border-radius:14px;background:rgba(247,243,234,.1);display:grid;place-items:center;color:var(--paper);flex:none}
.eyebrow{font-size:12px;letter-spacing:1.5px;color:#B9C2D6;font-weight:600}
.hero h1{margin:2px 0 0;font-size:32px;font-weight:800;letter-spacing:-.5px;line-height:1.15}
.hero p{margin:6px 0 0;color:#C9D0DF;font-size:15px}
.brand{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.ticket{max-width:608px;margin:-44px auto 0;background:var(--card);border-radius:22px;box-shadow:var(--shadow);position:relative}
.ticket-row{display:flex;padding:16px 18px;gap:12px}
.ticket-row > div{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.ticket-row small{font-size:12px;color:var(--muted);font-weight:600}
.ticket-row b{font-size:26px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.ticket-row .sep{flex:none;width:1px;background:var(--line-2)}
.tear{position:relative;height:0;border-top:2px dashed var(--line-2);margin:0 14px}
.tear::before,.tear::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--paper)}
.tear::before{right:-26px}.tear::after{left:-26px}
.ticket-foot{display:flex;align-items:center;gap:8px;padding:11px 18px;font-size:13px;color:var(--muted)}
/* buttons */
.btn{border:1px solid var(--line-2);border-radius:14px;padding:11px 16px;font-weight:600;cursor:pointer;background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px}
.btn.primary{background:var(--coral);color:var(--navy);border-color:transparent;font-weight:800;box-shadow:0 10px 24px rgba(255,107,74,.32)}
.btn.dark{background:var(--navy);color:var(--paper);border-color:transparent}
.btn.big{padding:15px 24px;font-size:17px}
.btn.wa{background:#25D366;color:#05301a;border-color:transparent}
.btn.ghost{background:transparent;border-color:transparent}
.btn.danger{color:#B4361F}
.btn.sm{padding:7px 12px;font-size:14px;border-radius:12px;min-height:38px}
.btn.soft{background:var(--paper);}
.btn.done{background:var(--teal-soft);color:var(--teal-ink);border-color:transparent}
.btn:disabled{opacity:.5}
.card{background:var(--card);border-radius:var(--r);border:0}
/* home */
.trip-list{display:grid;gap:12px;margin-top:-40px;position:relative}
.trip-card{display:flex;align-items:center;gap:14px;padding:16px;box-shadow:var(--shadow)}
.trip-ico{width:48px;height:48px;border-radius:14px;background:var(--navy);color:var(--paper);display:grid;place-items:center;flex:none}
.trip-card b{display:block;font-size:17px}
.trip-card small{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.empty .big-ico{width:64px;height:64px;border-radius:20px;background:var(--paper-2);display:grid;place-items:center;margin:0 auto 12px;color:var(--navy)}
/* avatars */
.avs{display:flex}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--navy);border:2px solid var(--navy);flex:none}
.avs .av + .av{margin-inline-start:-10px}
.av.lg{width:40px;height:40px;font-size:16px;border-color:transparent}
/* tabs */
.tabs{display:flex;gap:4px;margin:18px 0 6px;background:var(--paper-2);padding:4px;border-radius:14px}
.tab{flex:1;padding:10px 4px;border-radius:11px;background:transparent;border:0;font-weight:600;font-size:15px;white-space:nowrap;cursor:pointer;color:#3C4558;min-height:42px}
.tab.on{background:var(--navy);color:var(--paper)}
.day{margin:18px 4px 8px;font-size:13px;font-weight:600;color:var(--muted)}
.exp{display:flex;gap:12px;align-items:center;padding:13px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.exp:last-child{border-bottom:0}
.exp .ico{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;flex:none}
.exp .mid{flex:1;min-width:0}
.exp .mid b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.exp .mid small{color:var(--muted);font-size:13px}
.exp .amt{text-align:left;flex:none}
.exp .amt b{display:block;font-weight:700;font-size:15px}
.exp .amt small{color:var(--muted);font-size:12px}
.fab{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:6;padding:16px 28px;border-radius:999px;font-size:17px;white-space:nowrap}
.banner{padding:12px 14px;border-radius:14px;background:var(--warn-bg);color:var(--warn);font-size:14px;margin:12px 0}
.banner.info{background:var(--teal-soft);color:var(--ink)}
.banner a{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:40px}
.chip.on{background:var(--navy);color:var(--paper);border-color:var(--navy);font-weight:600}
#eSplit .chip.on{background:var(--teal);border-color:var(--teal);color:#fff}
#eSplit .chip:not(.on){border-style:dashed;color:var(--muted);background:transparent}
.ppl{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.pchip{border:1px solid var(--line-2);background:var(--card);border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;color:#3C4558;cursor:pointer;min-height:44px}
.pchip .av{width:30px;height:30px;border:0}
.pchip.on{border:2px solid var(--navy);color:var(--navy);font-weight:700}
.person{display:flex;align-items:center;gap:12px;padding:14px}
.person .mid{flex:1;min-width:0}
.person .mid small{display:block;color:var(--muted);font-size:13px}
.list{display:grid;gap:0;overflow:hidden}
.list > .person{border-bottom:1px solid var(--line)}
.list > .person:last-child{border-bottom:0}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;gap:10px}
.sec-h h3{margin:0;font-size:17px;font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:2px;background:var(--paper-2)}
.tile span{font-size:13px;font-weight:600}
.tile b{font-size:24px;font-weight:800;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.tile.neg{background:var(--coral-soft)} .tile.neg em,.tile.neg b{color:var(--coral-ink)}
.tile.pos{background:var(--teal-soft)} .tile.pos em,.tile.pos b{color:var(--teal-ink)}
.tile em{font-style:normal}
.tile.me{outline:2px solid var(--navy);outline-offset:-2px}
.xfer{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line)}
.xfer .mid{flex:1;font-size:15px;min-width:0}
.xfer .arrow{color:var(--muted)}
.xfer b.amt{font-weight:800;font-size:16px}
.card-h{padding:13px 16px 6px;font-size:15px;font-weight:700}
.crow{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:6px 16px}
.crow small{color:var(--muted);font-size:12px}
.linkbox{display:flex;gap:8px;align-items:center;padding:6px 6px 6px 10px;margin-top:10px;background:var(--paper);border-radius:14px}
.linkbox input{flex:1;min-width:0;border:0;background:transparent;direction:ltr;text-align:left;font-size:13px;color:var(--muted);outline:none}
/* modal */
.backdrop{position:fixed;inset:0;background:rgba(14,24,48,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--paper);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:30px 30px 0 0;padding:10px 20px 24px;animation:up .22s ease-out}
@media(min-width:700px){.backdrop{align-items:center}.sheet{border-radius:30px}}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.grab{width:44px;height:5px;border-radius:3px;background:#D9D0BF;margin:0 auto 12px}
.sheet h3{margin:0 0 16px;font-size:22px;font-weight:800}
.amount-box{background:var(--card);border-radius:22px;padding:14px 16px;margin-bottom:16px}
.amount-box .row{align-items:center}
.amount-inp{flex:1.4;min-width:0;border:0;outline:none;font-size:42px;font-weight:800;letter-spacing:-1px;text-align:center;direction:ltr;background:transparent}
.cur-sel{flex:1;border:0;background:var(--navy);color:var(--paper);font-weight:700;border-radius:14px;padding:11px 10px;min-height:46px;outline:none}
.conv{display:none;align-items:center;justify-content:center;gap:6px;font-size:13px;color:var(--teal-ink);background:var(--teal-soft);border-radius:10px;padding:7px 10px;margin-top:10px;text-align:center}
.conv.show{display:flex}
.field{margin-bottom:16px}
.field > label,.lbl{display:flex;justify-content:space-between;font-size:13px;font-weight:600;color:var(--muted);margin-bottom:8px}
.inp{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line-2);background:var(--card);outline:none;font-size:16px}
.inp:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(20,33,61,.12)}
.row{display:flex;gap:8px}
.row > *{min-width:0}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.err{color:#B4361F;font-size:14px;min-height:20px;margin:4px 0}
.prow{display:flex;gap:8px;margin-bottom:8px;align-items:center}
.prow .inp{padding:11px 12px}
.prow .x{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);cursor:pointer}
.actions{display:flex;gap:10px;margin-top:8px}
.actions .btn{flex:1;padding:15px}
.actions .btn.primary{flex:2}
.toast{position:fixed;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:var(--paper);padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:.2s;z-index:30}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.spinner{width:28px;height:28px;border:3px solid var(--paper-2);border-top-color:var(--coral);border-radius:50%;animation:spin 1s linear infinite;margin:60px auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}
.center{text-align:center;color:var(--muted)}
.muted{color:var(--muted)}
.confirm{display:none;margin-top:10px}
.confirm.show{display:block}
.csearch{margin-bottom:12px;position:relative}
.csearch .inp{padding-inline-start:40px}
.csearch .sic{position:absolute;margin:13px 12px 0;color:var(--muted);pointer-events:none}
.cres{background:var(--card);border-radius:14px;margin-top:6px;overflow:hidden;box-shadow:var(--shadow)}
.cres button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer;min-height:48px;text-align:right}
.cres button:last-child{border-bottom:0}
.cres button .mid{flex:1;min-width:0}
.cres button small{display:block;color:var(--muted);direction:ltr;text-align:right}
.cres button.added{opacity:.55}
.linkbtn,label.btn{cursor:pointer}
.linkbtn{background:none;border:0;padding:0;color:var(--teal);text-decoration:underline;cursor:pointer;font:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast"></div>
<script>
const ARTIFACT_URL = "";
/* ==== הגדרות Firebase: מדביקים כאן את ה-config מהקונסולה ==== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDQB51Y5dZM3oTwTpslygRIBtxPuxVWhDU",
  authDomain: "trip-expenses-6419f.firebaseapp.com",
  projectId: "trip-expenses-6419f",
  storageBucket: "trip-expenses-6419f.firebasestorage.app",
  messagingSenderId: "761860923653",
  appId: "1:761860923653:web:66fe246645c328f61e176c"
};

const CURRENCIES = [
  ["ILS","שקל"],["USD","דולר"],["EUR","אירו"],["GBP","לירה שטרלינג"],["THB","באט תאילנדי"],
  ["JPY","ין יפני"],["CHF","פרנק שוויצרי"],["CZK","קורונה צ'כית"],["HUF","פורינט הונגרי"],["PLN","זלוטי"],
  ["TRY","לירה טורקית"],["GEL","לארי גאורגי"],["AED","דירהם"],["INR","רופי הודי"],["VND","דונג וייטנאמי"],
  ["CAD","דולר קנדי"],["AUD","דולר אוסטרלי"],["RON","לאו רומני"],["BGN","לב בולגרי"],["EGP","לירה מצרית"],
  ["MXN","פסו מקסיקני"],["CNY","יואן"],["KRW","וון"],["NOK","כתר נורווגי"],["SEK","כתר שוודי"],["DKK","כתר דני"]
];
const CATS = [["food","🍽️","אוכל"],["stay","🏨","לינה"],["transport","🚕","תחבורה"],["fun","🎟️","אטרקציות"],["shop","🛒","קניות"],["other","📦","אחר"]];
const COLORS = ["#F7F3EA","#F4C95D","#9BD4C9","#FF8A6E","#C9B8FF","#A8D07A","#FFB8C9","#8EC5F0","#E9C9A0","#D3D9E6"];

let db = null, user = null, canWrite = true;
const S = { trips:[], tripsLoaded:false, tripId:null, trip:null, tripLoaded:false, expenses:[], expLoaded:false,
            tab:'expenses', route:'home', note:'', error:'' , noDb:false};
let unsubTrips=null, unsubTrip=null, unsubExp=null, tTrips=null, tTrip=null;

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = (p) => p + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const curName = c => (CURRENCIES.find(x=>x[0]===c)||[c,c])[1];
function fmt(n, cur){
  try { return '<bdi>'+new Intl.NumberFormat('he-IL',{style:'currency',currency:cur,maximumFractionDigits:2,minimumFractionDigits:0}).format(n)+'</bdi>'; }
  catch(e){ return '<bdi>'+(Math.round(n*100)/100)+' '+esc(cur)+'</bdi>'; }
}
function fmtTxt(n, cur){ const d=document.createElement('div'); d.innerHTML=fmt(n,cur); return d.textContent; }
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(()=>t.classList.remove('show'),2200); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

function pName(id){ const p=(S.trip?.participants||[]).find(p=>p.id===id); return p ? p.name : 'משתתף שהוסר'; }
function pIdx(id){ return Math.max(0,(S.trip?.participants||[]).findIndex(p=>p.id===id)); }
function avatar(id, cls=''){ const n=pName(id); return `<span class="av ${cls}" style="background:${COLORS[pIdx(id)%COLORS.length]}">${esc((n||'?').trim().charAt(0)||'?')}</span>`; }
function passed(){ const v=lsGet('pass-'+S.tripId); if(v==='creator') return true; return (S.trip?.participants||[]).some(p=>p.id===v); }
function tryGate(phone){
  const d=waPhone(phone); if(d.length<9) return 'הקלידו מספר טלפון מלא';
  const p=(S.trip?.participants||[]).find(x=>x.phone && waPhone(x.phone)===d);
  if(!p) return 'המספר הזה לא מופיע ברשימת המשתתפים של הטיול. אם זה טעות, בקשו ממי שפתח את הטיול להוסיף אתכם.';
  lsSet('pass-'+S.tripId, p.id); lsSet('me-'+S.tripId, p.id); addMyTrip(S.tripId, S.trip.name); return '';
}
function getMe(){ const v=lsGet('me-'+S.tripId); return (S.trip?.participants||[]).some(p=>p.id===v) ? v : null; }
function tripLink(id){ const base = ARTIFACT_URL || (location.href.split('#')[0]); return base + '#trip-' + id; }
function waPhone(p){ let d=String(p||'').replace(/[^\d+]/g,''); if(d.startsWith('+')) d=d.slice(1); else if(d.startsWith('00')) d=d.slice(2); else if(d.startsWith('0')) d='972'+d.slice(1); return d.replace(/\D/g,''); }
function waLink(phone, text){ const ph=waPhone(phone); return 'https://wa.me/'+(ph||'')+'?text='+encodeURIComponent(text); }

function onWriteError(e){
  console.error(e);
  if(e && e.code==='invalid_argument'){ canWrite=false; render(); toast('אין לך הרשאת עריכה'); }
  else if(e && e.code==='quota_exceeded'){ toast('המקום באפליקציה התמלא'); }
  else toast('השמירה נכשלה, נסו שוב');
}

/* ---------- data ---------- */
/* Each trip lives under its own secret top-level collection, so a trip link
   reaches only that trip. Each person's list of trips is private to them. */
const tripRef = id => db.doc('trips/'+id);
const expCol  = id => db.collection('trips/'+id+'/expenses');
const expRef  = (id,eid) => db.doc('trips/'+id+'/expenses/'+eid);
function secretId(){ const a=new Uint8Array(16); crypto.getRandomValues(a); return Array.from(a,b=>(b%36).toString(36)).join(''); }
let uid=null, myIdxRef=null, myIdxWritable=true;
function localTrips(){ try{ return JSON.parse(lsGet('mytrips')||'{}')||{}; }catch(e){ return {}; } }
function setLocalTrips(m){ lsSet('mytrips', JSON.stringify(m)); }
function mergedTrips(){ return {...localTrips(), ...(S.myTripsDb||{})}; }
async function saveMyTrips(m){
  setLocalTrips(m); S.myTripsDb = m; render();
  if(myIdxRef && myIdxWritable){ try{ await myIdxRef.set({trips:m}); }catch(e){ myIdxWritable=false; } }
}
async function addMyTrip(id,name){
  const m=mergedTrips(); if(m[id] && m[id].name===name) return;
  m[id]={name, addedAt:(m[id]&&m[id].addedAt)||Date.now()}; await saveMyTrips(m);
}
async function removeMyTrip(id){ const m=mergedTrips(); delete m[id]; await saveMyTrips(m); }
S.contacts=[];
let contactsRef=null;
async function loadContacts(){
  try{ S.contacts=JSON.parse(lsGet('contacts')||'[]')||[]; }catch(e){ S.contacts=[]; }
  if(contactsRef){ try{ const d=await contactsRef.get(); if(d.exists && Array.isArray(d.data().list)) S.contacts=d.data().list; }catch(e){} }
}
async function saveContacts(list){
  S.contacts=list; lsSet('contacts', JSON.stringify(list));
  if(contactsRef && myIdxWritable){
    const small=list.slice(0,3000);
    try{ await contactsRef.set({list:small}); }catch(e){ /* too large or not allowed: kept on this device */ }
  }
}
function subscribeTrips(){
  if(!myIdxRef){ S.tripsLoaded=true; render(); return; }

}
function openTrip(id){

  unsubExp = expCol(id).onSnapshot(snap=>{
    S.expenses = snap.docs.map(d=>({id:d.id, ...d.data()})); S.expLoaded = true; render();
  }, err=>{ S.expLoaded=true; render(); });
}
function closeTrip(){ unsubTrip&&unsubTrip(); unsubExp&&unsubExp(); unsubTrip=unsubExp=null; clearTimeout(tTrip); S.tripId=null; S.trip=null; }

/* ---------- math ---------- */
function boiRate(cur){ const r=S.boi?.rates?.[cur]; return (S.trip?.base==='ILS' && r>0) ? r : null; }
function rateKind(cur){ return (S.boi?.kind||{})[cur]||'boi'; }
function rateSrc(cur){ const t=S.trip; if(!t||cur===t.base) return 'base'; const m=Number((t.rates||{})[cur]); if(m>0) return 'manual'; return boiRate(cur)?rateKind(cur):null; }
function rateOf(cur){ const t=S.trip; if(!t) return null; if(cur===t.base) return 1; const r=Number((t.rates||{})[cur]); if(r>0) return r; return boiRate(cur); }
function boiDate(){ const d=S.boi?.date; if(!d) return ''; try{ const [y,m,dd]=d.split('-'); return dd+'/'+m+'/'+y; }catch(e){ return d; } }
async function getJson(u){ const r=await fetch(u); if(!r.ok) throw new Error(r.status); return r.json(); }
async function loadRates(){
  const rates={}, kind={}; let date='';
  try{ const j=await getJson('https://api.frankfurter.dev/v1/latest?base=ILS');
    for(const [k,v] of Object.entries(j.rates||{})) if(v>0){ rates[k]=1/v; kind[k]='ecb'; } date=j.date||''; }
  catch(e){ try{ const j=await getJson('https://api.frankfurter.app/latest?from=ILS');
    for(const [k,v] of Object.entries(j.rates||{})) if(v>0){ rates[k]=1/v; kind[k]='ecb'; } date=j.date||''; }catch(e2){} }
  try{ const j=await getJson('https://boi.org.il/PublicApi/GetExchangeRates');
    for(const x of (j.exchangeRates||[])){ if(x.key==='LBP'||!(x.currentExchangeRate>0)) continue; rates[x.key]=x.currentExchangeRate/(x.unit||1); kind[x.key]='boi'; date=(x.lastUpdate||'').slice(0,10)||date; } }
  catch(e){}
  if(Object.keys(rates).length){ S.boi={rates,kind,date}; render(); }
}
function compute(){
  const t=S.trip, P=t.participants||[];
  const bal={}, paid={}, share={}; P.forEach(p=>{bal[p.id]=0;paid[p.id]=0;share[p.id]=0;});
  let total=0; const missing=new Set();
  for(const e of S.expenses){
    const r=rateOf(e.currency); if(!r){ missing.add(e.currency); continue; }
    const amt=(Number(e.amount)||0)*r;
    if(e.kind==='transfer'){ if(e.payer in bal) bal[e.payer]+=amt; if(e.to in bal) bal[e.to]-=amt; continue; }
    const among=(e.splitAmong||[]).filter(id=>id in bal); if(!among.length) continue;
    total+=amt;
    if(e.payer in bal){ paid[e.payer]+=amt; bal[e.payer]+=amt; }
    const each=amt/among.length; among.forEach(id=>{ share[id]+=each; bal[id]-=each; });
  }
  return {bal,paid,share,total,missing:[...missing]};
}
function settle(bal){
  const cr=[],db_=[];
  for(const [id,v] of Object.entries(bal)){ const c=Math.round(v*100)/100; if(c>0.009) cr.push({id,v:c}); else if(c<-0.009) db_.push({id,v:-c}); }
  cr.sort((a,b)=>b.v-a.v); db_.sort((a,b)=>b.v-a.v);
  const out=[]; let i=0,j=0;
  while(i<db_.length && j<cr.length){ const x=Math.min(db_[i].v,cr[j].v); out.push({from:db_[i].id,to:cr[j].id,amt:Math.round(x*100)/100});
    db_[i].v-=x; cr[j].v-=x; if(db_[i].v<0.01) i++; if(cr[j].v<0.01) j++; }
  return out;
}

function isMaster(){ return lsGet('isMaster')==='1' && !!creatorCode(); }

/* ---------- routing ---------- */
function route(){
  const h=location.hash.slice(1);
  const inv=h.match(/^invite-([A-Za-z0-9]{8,})-(\d{10,})$/);
  if(inv){ acceptInvite(inv[1], +inv[2]); history.replaceState(null,'',location.pathname); }
  if(h.startsWith('trip-') && h.length>5){ const id=h.slice(5); if(S.tripId!==id) openTrip(id); S.route='trip'; }
  else { if(S.tripId) closeTrip(); S.route='home'; }
  render();
}

function render(){
  const app=$('#app');
  if(S.noDb){ app.innerHTML=topBar()+`<main class="wrap"><div class="empty">${S.noDbMsg||'לא מצליחים להתחבר למאגר הנתונים. בדקו את החיבור לאינטרנט ונסו שוב.'}</div></main>`; return; }
  app.innerHTML = S.route==='trip' ? renderTrip() : renderHome();
}

function missingBanner(c){ return c.missing.length ? `<div class="banner">חסר שער המרה ל־${c.missing.map(esc).join(', ')}, ולכן הוצאות במטבע הזה עוד לא נספרות. <a href="#" data-act="tab" data-tab="settings">הגדרת שער</a></div>` : ''; }
function tabExpenses(me,c){
  if(!S.expLoaded) return loading();
  const exps=[...S.expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||'') || (b.createdAt||0)-(a.createdAt||0));
  let html=missingBanner(c);
  if(!exps.length) return html+`<div class="empty"><div class="big-ico">${ico('fun',28)}</div>עוד אין הוצאות.<br>לחצו על "הוספת הוצאה" כדי להתחיל.</div>`;
  let lastDay=null, groups=[];
  for(const e of exps){ if(e.date!==lastDay){ groups.push({day:e.date,items:[]}); lastDay=e.date; } groups[groups.length-1].items.push(e); }
  html+=groups.map(g=>`<div class="day">${esc(fmtDay(g.day))}</div><div class="card list">${g.items.map(expRow).join('')}</div>`).join('');
  return html;
}
function fmtDay(d){ if(!d) return ''; try{ const [y,m,dd]=d.split('-').map(Number); return new Date(y,m-1,dd).toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long'}); }catch(e){ return d; } }
function expRow(e){
  const t=S.trip, r=rateOf(e.currency);
  const conv = (e.currency!==t.base && r) ? `<small>≈ ${fmt(e.amount*r,t.base)}</small>` : (e.currency!==t.base?'<small>אין שער</small>':'');
  if(e.kind==='transfer'){
    return `<div class="exp" data-act="editExp" data-id="${esc(e.id)}"><span class="ico" style="background:#FCF0D2;color:#8A5A00">${ico('transfer')}</span>
      <span class="mid"><b>${esc(pName(e.payer))} ← ${esc(pName(e.to))}</b><small>החזר חוב</small></span>
      <span class="amt"><b>${fmt(e.amount,e.currency)}</b>${conv}</span></div>`;
  }
  const cat=CATS.find(c=>c[0]===e.cat)||CATS[5], cs=CAT_STYLE[cat[0]]||CAT_STYLE.other;
  const n=(e.splitAmong||[]).length, all=n===t.participants.length;
  return `<div class="exp" data-act="editExp" data-id="${esc(e.id)}"><span class="ico" style="background:${cs[0]};color:${cs[1]}">${ico(cat[0])}</span>
    <span class="mid"><b>${esc(e.desc||cat[2])}</b><small>${esc(pName(e.payer))} שילם/ה · ${all?'כולם':n+' אנשים'}</small></span>
    <span class="amt"><b>${fmt(e.amount,e.currency)}</b>${conv}</span></div>`;
}

function tabBalance(me,c){
  if(!S.expLoaded) return loading();
  const t=S.trip, xs=settle(c.bal), inShek=t.base==='ILS'?'בשקלים':'ב'+esc(curName(t.base));
  let html=missingBanner(c);
  const ppl=[...t.participants].sort((a,b)=>c.bal[a.id]-c.bal[b.id]);
  html+=`<div class="sec-h"><h3>סיכום סופי ${inShek}</h3></div><div class="tiles">${ppl.map(p=>{ const b=Math.round(c.bal[p.id]*100)/100;
    const cls=b<-0.009?'neg':b>0.009?'pos':''; const verb=b<-0.009?'צריך/ה להביא':b>0.009?'מקבל/ת':'מאוזן/ת';
    return `<div class="tile ${cls} ${p.id===me?'me':''}"><span>${esc(p.name)}${p.id===me?' (אני)':''} <em>${verb}</em></span><b>${fmt(Math.abs(b),t.base)}</b></div>`;}).join('')}</div>`;
  html+=`<div class="card" style="margin-top:14px"><div class="card-h">${xs.length?`${xs.length===1?'העברה אחת':xs.length+' העברות'} וסגרנו`:'אין העברות'}</div>
    ${xs.length? xs.map((x,i)=>`<div class="xfer"><span class="mid">${esc(pName(x.from))} <span class="arrow">←</span> ${esc(pName(x.to))}</span><b class="amt">${fmt(x.amt,t.base)}</b>
      ${canWrite?`<button class="btn sm soft" data-act="markPaid" data-i="${i}">שולם</button>`:''}</div>`).join('')
      : `<div class="xfer"><span class="mid muted">${S.expenses.length?'כולם מאוזנים, אף אחד לא חייב לאף אחד.':'עוד אין הוצאות לחישוב.'}</span></div>`}</div>`;
  const byCur={}; S.expenses.filter(e=>e.kind!=='transfer').forEach(e=>{ byCur[e.currency]=(byCur[e.currency]||0)+(Number(e.amount)||0); });
  const curKeys=Object.keys(byCur);
  if(curKeys.length) html+=`<div class="card" style="margin-top:14px;padding-bottom:8px"><div class="card-h">לפי מטבע</div>
    ${curKeys.map(k=>{ const r=rateOf(k), src=rateSrc(k);
      return `<div class="crow"><span>${esc(curName(k))}${k===t.base?'':' · '+fmt(byCur[k],k)} ${k!==t.base&&r?`<small>${src==='boi'?'יציג':src==='ecb'?'ECB':'ידני'} ${+r.toFixed(4)}</small>`:''}</span><b style="font-weight:600">${r?fmt(byCur[k]*r,t.base):'<span class="muted">אין שער</span>'}</b></div>`;}).join('')}
    <div class="crow" style="border-top:1px solid var(--line);margin-top:4px;padding-top:10px"><b>סה״כ</b><b>${fmt(c.total,t.base)}</b></div></div>`;
  html+=`<div class="card" style="margin-top:14px;padding-bottom:6px"><div class="card-h">מי שילם כמה</div>
    ${t.participants.map(p=>`<div class="crow"><span>${esc(p.name)}</span><span>שילם/ה <b>${fmt(c.paid[p.id],t.base)}</b> <small>· חלק ${fmt(c.share[p.id],t.base)}</small></span></div>`).join('')}</div>`;
  if(xs.length) html+=`<a class="btn primary" style="width:100%;margin-top:16px;padding:16px" target="_blank" rel="noopener" href="${esc(waLink('',summaryText(c,xs)))}">${ico('share')} שליחת הסיכום לקבוצה</a>`;
  S._xs=xs;
  return html;
}

function summaryText(c,xs){
  const t=S.trip;
  let s=`🧳 ${t.name} – סיכום הוצאות\nסה״כ: ${fmtTxt(c.total,t.base)}\n\nמי משלם למי:\n`;
  s+=xs.map(x=>`• ${pName(x.from)} ← ${pName(x.to)}: ${fmtTxt(x.amt,t.base)}`).join('\n');
  s+=`\n\nכל הפרטים: ${tripLink(t.id)}`;
  return s;
}

/* ---------- modals ---------- */
function openModal(html){
  const r=$('#modal-root');
  r.innerHTML=`<div class="backdrop" data-close="1"><div class="sheet" role="dialog"><div class="grab"></div>${html}</div></div>`;
  r.querySelector('.backdrop').addEventListener('mousedown',e=>{ if(e.target.dataset.close) closeModal(); });
  return r.querySelector('.sheet');
}
function closeModal(){ $('#modal-root').innerHTML=''; }

function tripForm(existing){
  const used = existing ? new Set(S.expenses.flatMap(e=>[e.payer,e.to,...(e.splitAmong||[])])) : new Set();
  const st = existing ? JSON.parse(JSON.stringify({name:existing.name,base:existing.base,participants:existing.participants}))
    : {name:'',base:'ILS',participants:[{id:rid('p'),name:'',phone:''}]};
  const el=openModal(`<h3>${existing?'עריכת הטיול':'טיול חדש'}</h3>
    <div class="field"><label>שם הטיול</label><input class="inp" id="tName" placeholder="למשל: תאילנד 2026" value="${esc(st.name)}"></div>
    <div class="banner info" style="margin-top:0">בטיול אפשר לרשום הוצאות בכל מטבע. בסוף הכול מחושב בשקלים.</div>
    <div class="field"><label for="cQ">משתתפים</label>
      <div class="csearch"><span class="sic"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg></span>
        <input class="inp" id="cQ" placeholder="חיפוש באנשי הקשר לפי שם או מספר" autocomplete="off"><div class="cres" id="cRes"></div>
        <div class="hint" id="cInfo"></div>
        <div id="pasteBox" style="display:none;margin-top:10px">
          <label for="pasteTxt" class="lbl">מדביקים שורה לכל אדם: שם ומספר</label>
          <textarea class="inp" id="pasteTxt" rows="5" placeholder="נועה 050-1234567&#10;יוסי 052-7654321" style="resize:vertical"></textarea>
          <button type="button" class="btn sm dark" data-c="pasteAdd" style="margin-top:8px">הוספת המשתתפים</button>
        </div>
        <input type="file" id="vcfInp" multiple class="sr" tabindex="-1"></div>
      <div id="pRows"></div>
      <button class="btn sm" id="addP" type="button">+ הוספה ידנית</button></div>
    <div class="err" id="tErr"></div>
    <div class="actions"><button class="btn primary" id="tSave">${existing?'שמירה':'יצירת הטיול'}</button><button class="btn" id="tCancel">ביטול</button></div>`);
  const rows=el.querySelector('#pRows');
  const draw=()=>{ rows.innerHTML=st.participants.map((p,i)=>`<div class="prow">
      <input class="inp" data-i="${i}" data-f="name" placeholder="שם" value="${esc(p.name)}" style="flex:1.2">
      <input class="inp" data-i="${i}" data-f="phone" placeholder="050-0000000" inputmode="tel" value="${esc(p.phone)}" style="flex:1;direction:ltr;text-align:left">
      <button class="x" type="button" data-rm="${i}" ${used.has(p.id)?'disabled title="יש לו הוצאות"':''}>✕</button></div>`).join(''); };
  draw();
  rows.addEventListener('input',e=>{ const i=e.target.dataset.i; if(i!=null) st.participants[i][e.target.dataset.f]=e.target.value; });
  rows.addEventListener('click',e=>{ const i=e.target.dataset.rm; if(i!=null && !e.target.disabled){ st.participants.splice(+i,1); draw(); } });
  el.querySelector('#addP').onclick=()=>{ st.participants.push({id:rid('p'),name:'',phone:''}); draw(); rows.querySelector('.prow:last-child input').focus(); };
  const addPeople=(list)=>{
    let added=0;
    for(const c of list){
      const name=(c.name||'').trim(), phone=(c.phone||'').trim(); if(!name && !phone) continue;
      if(phone && st.participants.some(p=>waPhone(p.phone)===waPhone(phone))) continue;
      const empty=st.participants.find(p=>!p.name.trim() && !p.phone.trim());
      if(empty){ empty.name=name; empty.phone=phone; } else st.participants.push({id:rid('p'),name,phone});
      added++;
    }
    draw(); toast(added? (added===1?'נוסף משתתף':'נוספו '+added+' משתתפים') : 'לא נמצאו אנשי קשר חדשים');
  };
  const vcf=el.querySelector('#vcfInp'), cQ=el.querySelector('#cQ'), cRes=el.querySelector('#cRes'), cInfo=el.querySelector('#cInfo');
  const digits=v=>String(v||'').replace(/\D/g,'');
  const isAdded=c=>st.participants.some(p=>(c.p && waPhone(p.phone)===waPhone(c.p)) || (!c.p && p.name.trim()===c.n));
  const drawInfo=()=>{
    const n=S.contacts.length;
    cInfo.innerHTML = n
      ? `${n} אנשי קשר שמורים אצלך · <label for="vcfInp" class="linkbtn">ייבוא נוסף</label> · <button type="button" class="linkbtn" data-c="paste">הדבקת רשימה</button> · <button type="button" class="linkbtn" data-c="clear">מחיקה</button>`
      : `כדי לחפש, ייבאו פעם אחת את אנשי הקשר:<br><button type="button" class="btn sm dark" data-c="paste" style="margin:8px 0">הדבקת רשימה</button> <label for="vcfInp" class="btn sm" style="margin:8px 0">בחירת קובץ אנשי קשר</label>${(navigator.contacts&&navigator.contacts.select)?' <button type="button" class="btn sm primary" data-c="picker" style="margin:8px 0">בחירה מאנשי הקשר בטלפון</button>':''}<br>
         <b>מגוגל:</b> contacts.google.com ← ייצוא ← vCard. <b>אייפון:</b> אנשי קשר ← איש קשר ← שיתוף ← שמירה בקבצים.<br>אנשי הקשר נשמרים רק בטלפון הזה ולא נשלחים לשום מקום.`;
  };
  const drawRes=()=>{
    const q=cQ.value.trim(); if(!q){ cRes.innerHTML=''; return; }
    if(!S.contacts.length){ cRes.innerHTML=`<label for="vcfInp" style="display:flex;padding:12px 14px;cursor:pointer;min-height:48px;align-items:center">אין עדיין אנשי קשר שמורים. לחצו כאן לבחירת קובץ</label>`; return; }
    const ql=q.toLowerCase(), qd=digits(q);
    const hits=S.contacts.filter(c=>c.n.toLowerCase().includes(ql) || (qd.length>=3 && digits(c.p).includes(qd))).slice(0,8);
    cRes.innerHTML = hits.length ? hits.map((c,i)=>{ const ad=isAdded(c);
      return `<button type="button" class="${ad?'added':''}" data-hit="${S.contacts.indexOf(c)}"><span class="mid">${esc(c.n||c.p)}<small>${esc(c.p||'')}</small></span><span>${ad?'נוסף ✓':ico('plus',18,2.5)}</span></button>`;}).join('')
      : `<button type="button" data-c="manual"><span class="mid">לא נמצא "${esc(q)}". הוספה ידנית</span></button>`;
  };
  cQ.addEventListener('input',drawRes);
  el.addEventListener('click',async e=>{
    const h=e.target.closest('[data-hit]');
    if(h){ const c=S.contacts[+h.dataset.hit]; if(c && !isAdded(c)) addPeople([{name:c.n,phone:c.p}]); cQ.value=''; drawRes(); cQ.focus(); return; }
    const b=e.target.closest('[data-c]'); if(!b) return;
    const c=b.dataset.c;
    if(c==='picker'){
      try{ const cs=await navigator.contacts.select(['name','tel'],{multiple:true});
        addPeople(cs.map(x=>({name:(x.name&&x.name[0])||'', phone:(x.tel&&x.tel[0])||''}))); }
      catch(err){ toast('הטלפון חסם את אנשי הקשר. בחרו קובץ במקום'); }
    } else if(c==='paste'){ const pb=el.querySelector('#pasteBox'); pb.style.display=''; el.querySelector('#pasteTxt').focus(); }
    else if(c==='pasteAdd'){
      const txt=el.querySelector('#pasteTxt').value; const people=parsePasted(txt);
      if(!people.length){ toast('לא זיהיתי שמות או מספרים'); return; }
      addPeople(people);
      const map=new Map(S.contacts.map(x=>[x.n+'|'+digits(x.p),x])); people.forEach(p=>map.set(p.name+'|'+digits(p.phone),{n:p.name,p:p.phone}));
      saveContacts([...map.values()].sort((a,b)=>a.n.localeCompare(b.n,'he'))); drawInfo();
      el.querySelector('#pasteTxt').value=''; el.querySelector('#pasteBox').style.display='none';
    } else if(c==='clear'){ b.dataset.c='clearYes'; b.textContent='בטוח? לחצו שוב למחיקה'; }
    else if(c==='clearYes'){ await saveContacts([]); drawInfo(); drawRes(); toast('אנשי הקשר נמחקו'); }
    else if(c==='manual'){ const q=cQ.value.trim(); const isNum=digits(q).length>=6;
      st.participants.push({id:rid('p'),name:isNum?'':q,phone:isNum?q:''}); cQ.value=''; drawRes(); draw();
      rows.querySelector('.prow:last-child input').focus(); }
  });
  vcf.onchange=async()=>{
    const out=[]; for(const f of vcf.files){ try{ const txt=await readText(f); out.push(...parseContactsFile(txt)); }catch(e){ console.error(e); } }
    vcf.value='';
    const map=new Map(S.contacts.map(c=>[c.n+'|'+digits(c.p),c]));

function parseCsvRows(txt){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<txt.length;i++){ const ch=txt[i];
    if(q){ if(ch==='"'){ if(txt[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=ch; }
    else if(ch==='"') q=true; else if(ch===','){ row.push(f); f=''; }
    else if(ch==='\n'||ch==='\r'){ if(ch==='\r'&&txt[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=ch; }
  if(f||row.length){ row.push(f); rows.push(row); }
  return rows;
}
function parseCsvContacts(txt){
  const rows=parseCsvRows(txt.replace(/^﻿/,'')); if(rows.length<2) return [];
  const H=rows[0].map(h=>h.trim().toLowerCase());
  const col=(...names)=>{ for(const n of names){ const i=H.indexOf(n); if(i>=0) return i; } return -1; };
  const iName=col('name','display name','full name','שם'), iFirst=col('first name','given name','שם פרטי'), iMid=col('middle name','additional name'), iLast=col('last name','family name','שם משפחה');
  const phoneCols=H.map((h,i)=>({h,i})).filter(x=>/phone|טלפון|נייד/.test(x.h) && !/type|label|סוג/.test(x.h));
  const mobileFirst=phoneCols.sort((a,b)=>(/mobile|נייד/.test(b.h)?1:0)-(/mobile|נייד/.test(a.h)?1:0));
  const out=[];
  for(const r of rows.slice(1)){
    let name=iName>=0?(r[iName]||'').trim():'';
    if(!name) name=[iFirst,iMid,iLast].filter(i=>i>=0).map(i=>(r[i]||'').trim()).filter(Boolean).join(' ');
    let phone='';
    for(const c of mobileFirst){ const v=(r[c.i]||'').split(':::')[0].trim(); if(v.replace(/\D/g,'').length>=7){ phone=v; break; } }
    if(name||phone) out.push({name,phone});
  }
  return out;
}
function parseContactsFile(txt){
  if(/BEGIN:VCARD/i.test(txt)) return parseVcf(txt);
  const first=(txt.split(/\r?\n/)[0]||'').toLowerCase();
  if(first.includes(',') && /name|phone|שם|טלפון/.test(first)) return parseCsvContacts(txt);
  return parsePasted(txt);
}
function parsePasted(txt){
  if(/BEGIN:VCARD/i.test(txt)) return parseVcf(txt);
  const out=[];
  for(let line of String(txt).split(/\n|;/)){
    line=line.replace(/[\u200e\u200f\u202a-\u202e]/g,'').trim(); if(!line) continue;
    const m=line.match(/\+?\d[\d\s\-().]{6,}\d/);
    const phone=m?m[0].trim():'';
    const name=(m?line.replace(m[0],' '):line).replace(/[,:\-–—|•\t]+/g,' ').replace(/\s+/g,' ').trim();
    if(name||phone) out.push({name,phone});
  }
  return out;
}
function readText(f){
  if(f.text) return f.text();
  return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsText(f); });
}
function parseVcf(txt){
  const lines=txt.replace(/\r\n?/g,'\n').replace(/\n[ \t]/g,'').replace(/=\n/g,'').split('\n');
  const out=[]; let cur=null;
  const qp=(v)=>{ try{ const bytes=[]; for(let i=0;i<v.length;i++){ if(v[i]==='='&&/^[0-9A-F]{2}$/i.test(v.substr(i+1,2))){ bytes.push(parseInt(v.substr(i+1,2),16)); i+=2; } else bytes.push(v.charCodeAt(i)); } return new TextDecoder('utf-8').decode(new Uint8Array(bytes)); }catch(e){ return v; } };
  for(const ln of lines){
    const i=ln.indexOf(':'); if(i<0) continue;
    const key=ln.slice(0,i).toUpperCase(), val=ln.slice(i+1).trim();
    const dec = key.includes('QUOTED-PRINTABLE') ? qp(val) : val;
    const k=key.split(';')[0].replace(/^ITEM\d+\./,'');
    if(k==='BEGIN') cur={name:'',n:'',phone:''};
    else if(!cur) continue;
    else if(k==='FN') cur.name=dec.replace(/\\,/g,',');
    else if(k==='N' && !cur.n) cur.n=dec.split(';').slice(0,2).reverse().filter(Boolean).join(' ');
    else if(k==='TEL' && (!cur.phone || /CELL|MOBILE/.test(key))) cur.phone=dec;
    else if(k==='END'){ out.push({name:cur.name||cur.n, phone:cur.phone}); cur=null; }
  }
  return out;
}

async function makeDb(){
  const V='10.12.2';
  const A=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`);
  const F=await import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`);
  const app=A.initializeApp(FIREBASE_CONFIG);
  let fs; try{ fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache()}); }catch(e){ fs=F.getFirestore(app); }
  const code=e=>({code:(e&&e.code==='permission-denied')?'invalid_argument':'unavailable', message:String(e&&e.message||e)});
  const wrap=s=>({id:s.id, exists:s.exists(), data:()=>s.data(), metadata:{fromCache:s.metadata.fromCache, hasPendingWrites:s.metadata.hasPendingWrites}});
  const doc=path=>{ const r=F.doc(fs,path); return {
    get: async()=>wrap(await F.getDoc(r)),
    set: d=>F.setDoc(r,d).catch(e=>{ throw code(e); }),
    update: d=>F.setDoc(r,d,{merge:true}).catch(e=>{ throw code(e); }),
    delete: ()=>F.deleteDoc(r).catch(e=>{ throw code(e); }),
    onSnapshot:(n,er)=>F.onSnapshot(r,{includeMetadataChanges:true},s=>n(wrap(s)),e=>er&&er(code(e))) }; };
  const collection=path=>{ const c=F.collection(fs,path); return {
    onSnapshot:(n,er)=>F.onSnapshot(c,{includeMetadataChanges:true},s=>n({docs:s.docs.map(wrap), metadata:{fromCache:s.metadata.fromCache}}),e=>er&&er(code(e))) }; };
  const createTrip=async(id,data,cc)=>{ const b=F.writeBatch(fs); b.set(F.doc(fs,'trips/'+id),data); b.set(F.doc(fs,'creators/'+id),{code:cc}); try{ await b.commit(); }catch(e){ throw code(e); } };
  const writeInvite=(inv,d)=>F.setDoc(F.doc(fs,'invites/'+inv),{master:d.master, name:d.name, expiresAt:F.Timestamp.fromMillis(d.expiresAt)}).catch(e=>{ throw code(e); });
  const checkMaster=async(m)=>{ try{ await F.setDoc(F.doc(fs,'invites/chk'+inviteCode()),{master:m,name:'check',expiresAt:F.Timestamp.fromMillis(Date.now()-1000)}); return true; }catch(e){ return false; } };
  return {doc, collection, createTrip, writeInvite, checkMaster};
}

(async()=>{
